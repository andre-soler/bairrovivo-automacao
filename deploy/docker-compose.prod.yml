# Automação BairroVivo em PRODUÇÃO (VM Azure do MVP)
#
# Projeto Compose SEPARADO do MVP, de propósito:
# o deploy do MVP roda "docker compose up --remove-orphans" a cada minuto no
# projeto "bairrovivo". Se o n8n estivesse no compose do MVP, seria removido
# como órfão. Aqui ele só ENTRA na rede interna do MVP para enxergar o banco.
#
# Uso (na VM):  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
name: bairrovivo-automacao

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: bairrovivo-n8n
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY em deploy/.env}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    # Painel só na própria VM. O NSG não abre a 5678; o acesso é por túnel SSH.
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../workflows:/home/node/workflows:ro
    networks: [mvp]
    security_opt: ["no-new-privileges:true"]
    # Teto de recursos: a automação nunca disputa CPU/memória com o MVP
    mem_limit: 1g
    cpus: 0.5

networks:
  # Rede interna criada pelo compose do MVP (projeto "bairrovivo", rede "backend").
  # O banco é encontrado pelo nome "db", sem nenhuma porta publicada.
  mvp:
    external: true
    name: bairrovivo_backend

volumes:
  n8n_data:
