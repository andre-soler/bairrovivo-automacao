name: bairrovivo-automacao

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bairrovivo}
      POSTGRES_DB: ${POSTGRES_DB:-bairrovivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [backend]

  app:
    image: ghcr.io/victorasfur/bairrovivo-secure:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bairrovivo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bairrovivo}
    ports:
      - "127.0.0.1:8000:8000"
    networks: [backend]

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina no .env}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

networks:
  backend:

volumes:
  pgdata:
  n8n_data: